name = "icons-pro-api"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

[[r2_buckets]]
binding = "ICONS_R2"
bucket_name = "ozpro-icons"

[vars]
SERVICE_NAME = "Icons Pro API"
ENVIRONMENT = "production"
GITHUB_REPO = "clepta2/icons-pro"
DOCS_URL = "https://github.com/clepta2/icons-pro"
API_VERSION = "1.0.0"
